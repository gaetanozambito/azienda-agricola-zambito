backend:
  name: github
  repo: gaetanozambito/azienda-agricola-zambito
  branch: main
  base_url: https://zambito-decap-oauth.folderdj.workers.dev
  auth_endpoint: auth
media_folder: uploads
public_folder: /uploads
locale: it
publish: true
collections:
  - name: catalogo
    label: Catalogo prodotti
    files:
      - name: prodotti
        label: Prodotti, prezzi e certificazioni
        file: catalogo.json
        format: json
        fields:
          - {label: Nome azienda, name: azienda, widget: string}
          - {label: Denominazione olio, name: prodotto, widget: string}
          - {label: Prezzo di riferimento per litro (€), name: prezzo_litro_eur, widget: number, value_type: float, min: 0, step: 0.01, hint: "Solo informativo: ogni prodotto ha un prezzo autonomo."}
          - {label: Valuta, name: valuta, widget: hidden, default: EUR}
          - label: Certificazioni e dichiarazioni
            name: certificazioni
            widget: object
            hint: "Seleziona verificato solo se possiedi la documentazione pertinente. La pubblicazione mostra il badge soltanto per lo stato verificato."
            fields:
              - {label: Certificazione biologica, name: biologico, widget: select, options: [da_verificare, verificato], default: da_verificare}
              - {label: DOP Val di Mazara, name: dop_val_di_mazara, widget: select, options: [da_verificare, verificato], default: da_verificare}
          - label: Schede prodotto
            name: prodotti
            widget: list
            summary: "{{fields.nome}} — €{{fields.prezzo_eur}}"
            min: 1
            fields:
              - {label: ID univoco, name: id, widget: string, hint: "Es. latta-5l; non duplicare tra prodotti."}
              - {label: Nome prodotto, name: nome, widget: string}
              - {label: Capacità (litri), name: litri, widget: number, value_type: float, min: 0.1, step: 0.1}
              - {label: Prezzo (€), name: prezzo_eur, widget: number, value_type: float, min: 0, step: 0.01}
              - {label: Prezzo precedente da barrare (€), name: prezzo_precedente_eur, widget: number, value_type: float, min: 0, step: 0.01, required: false, hint: "Facoltativo: visibile barrato solo se maggiore del prezzo attuale. Usare un prezzo precedente reale."}
              - {label: Descrizione, name: descrizione, widget: text, required: false}
              - {label: Foto principale, name: immagine, widget: image, required: false, hint: "Foto reale del prodotto; preferibilmente verticale e luminosa."}
              - label: Galleria fotografica
                name: galleria
                widget: list
                required: false
                field: {label: Foto, name: immagine, widget: image}
              - {label: Disponibile, name: disponibile, widget: boolean, default: true}
              - {label: In evidenza, name: in_evidenza, widget: boolean, default: false}
  - name: sito
    label: Sito e contatti
    files:
      - name: impostazioni
        label: Homepage, logo e contatti
        file: sito.json
        format: json
        fields:
          - {label: Logo aziendale, name: logo, widget: image, required: false}
          - {label: Foto principale homepage, name: hero_immagine, widget: image, required: false}
          - label: Carosello multimediale homepage
            name: hero_slides
            widget: list
            required: false
            collapsed: true
            summary: "{{fields.titolo}} — {{fields.tipo}}"
            hint: "Aggiungi fotografie e video. Puoi riordinare le slide trascinandole."
            fields:
              - label: Nome della slide
                name: titolo
                widget: string
                hint: "Nome identificativo visibile solo nel pannello."

              - label: Tipo di contenuto
                name: tipo
                widget: select
                options:
                  - {label: Fotografia, value: immagine}
                  - {label: Video MP4, value: video}
                default: immagine

              - label: Fotografia
                name: immagine
                widget: image
                required: false
                hint: "Carica una fotografia per questa slide."

              - label: Video MP4
                name: video
                widget: file
                required: false
                hint: "Carica un breve video MP4, preferibilmente compresso."

              - label: Durata della slide (secondi)
                name: durata
                widget: number
                value_type: int
                default: 8
                min: 3
                max: 60 
          - {label: Soprattitolo homepage, name: hero_soprattitolo, widget: string}
          - {label: Titolo homepage, name: hero_titolo, widget: string}
          - {label: Descrizione homepage, name: hero_descrizione, widget: text}
          - {label: Titolo sezione azienda, name: azienda_titolo, widget: string}
          - {label: Presentazione azienda, name: azienda_testo, widget: text}
          - {label: Foto azienda/uliveti, name: azienda_immagine, widget: image, required: false}
          - {label: Titolo catalogo, name: catalogo_titolo, widget: string}
          - {label: Titolo contatti, name: contatti_titolo, widget: string}
          - {label: Testo contatti, name: contatti_testo, widget: text}
          - {label: WhatsApp internazionale senza + (es. 393331234567), name: whatsapp, widget: string, required: false}
          - {label: Messaggio WhatsApp generico, name: whatsapp_messaggio, widget: text}
          - {label: Email pubblica, name: email, widget: string, required: false}
          - {label: Località, name: localita, widget: string, required: false}
