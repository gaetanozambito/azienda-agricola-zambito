# Configurare il provider OAuth GitHub prima dell'accesso al pannello.
backend:
  name: github
  repo: gaetanozambito/azienda-agricola-zambito
  branch: main
  # base_url: https://IL-TUO-SERVIZIO-OAUTH.example
  # auth_endpoint: auth
media_folder: "uploads"
public_folder: "/uploads"
locale: it
collections:
  - name: "catalogo"
    label: "Catalogo e contatti"
    files:
      - label: "Prodotti e prezzi"
        name: "prodotti"
        file: "catalogo.json"
        format: json
        fields:
          - {label: "Nome azienda", name: azienda, widget: string}
          - {label: "Nome prodotto", name: prodotto, widget: string}
          - {label: "Prezzo per litro (€)", name: prezzo_litro_eur, widget: number, value_type: float, min: 0, step: 0.01}
          - {label: "Valuta", name: valuta, widget: hidden, default: EUR}
          - label: "Formati in litri"
            name: formati_litri
            widget: list
            field: {label: "Litri", name: litri, widget: number, value_type: int, min: 1}
          - {label: "WhatsApp (prefisso internazionale, senza +)", name: whatsapp, widget: string, required: false}
          - label: "Verifica certificazioni (uso interno)"
            name: certificazioni
            widget: object
            fields:
              - {label: "Biologico", name: biologico, widget: select, options: [da_verificare, verificato], default: da_verificare}
              - {label: "DOP Val di Mazara", name: dop_val_di_mazara, widget: select, options: [da_verificare, verificato], default: da_verificare}
